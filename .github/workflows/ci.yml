name: Acceptance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Lint code style
        run: task lint

      - name: Type check
        run: task typecheck

      - name: Run unit tests
        run: task test

      - name: Install Chromium browser
        run: bunx playwright install --with-deps chromium

      - name: Export GitHub Actions runtime variables
        id: github-env
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub Actions only exposes these to actions, not to run: steps
            // The artifact client needs these variables to upload artifacts
            // Expose them as step outputs (not via GITHUB_ENV) so only the step that needs them receives them
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (token !== undefined) {
              core.setSecret(token);
              core.setOutput("token", token);
            }
            if (resultsUrl !== undefined) {
              core.setOutput("results_url", resultsUrl);
            }

      - name: Verify reporter usage
        run: task verify summary="$GITHUB_STEP_SUMMARY"
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ steps.github-env.outputs.token }}
          ACTIONS_RESULTS_URL: ${{ steps.github-env.outputs.results_url }}

      - name: Verify screenshot and video artifacts were uploaded
        timeout-minutes: 2
        run: |
          for name in playwright-screenshots playwright-videos; do
            found=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$name\")] | length")
            if [ "$found" -ne 1 ]; then
              echo "::error::Expected exactly one $name artifact, found $found"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run mutation tests
        run: task mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/

  release-please:
    name: Release Please
    needs: [tests, mutation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public
