# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:

  install:
    sources:
      - package.json
    generates:
      - bun.lock
    cmd: bun install --frozen-lockfile

  test:
    cmd: bun test --coverage

  test:watch:
    interactive: true
    cmd: bun test --watch

  lint:
    sources: &typescript-sources
      - ./index.ts
      - ./playwright.config.ts
      - ./src/**/*.ts
      - ./test/**/*.ts
      - ./e2e/**/*.ts
      - ./scripts/**/*.ts
    cmd: bunx biome check .

  format:
    sources: *typescript-sources
    cmd: bunx biome check --write .

  typecheck:
    desc: Type-check every TypeScript file (bun test does not type-check)
    cmd: bunx tsc --noEmit --project tsconfig.json

  verify:
    requires:
      vars:
      - summary
    cmds:
      - cmd: GITHUB_STEP_SUMMARY={{ .summary }} bunx playwright test
        ignore_error: true
      - diff -u e2e/snapshots/summary.md {{ .summary }}

  build:
    cmds:
      - bun build index.ts --outdir dist --target node --external '@actions/core' --external '@playwright/test'
      - bunx tsc --project tsconfig.build.json

  playwright:diff:
    desc: Diff reporter-facing Playwright types between the installed and a target version (default latest)
    cmd: bun scripts/diffPlaywrightTypes.ts {{ .version | default "latest" }}

  test:all:
    cmds:
      - task: format
      - task: lint
      - task: typecheck
      - task: test
      - task: verify
        vars:
          summary: test-results/summary.md
      - task: build
