# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:

  install:
    sources:
      - package.json
    generates:
      - bun.lock
    cmd: bun install --frozen-lockfile

  test:
    cmd: bun test --coverage

  test:watch:
    interactive: true
    cmd: bun test --watch

  lint:
    sources: &typescript-sources
      - ./index.ts
      - ./playwright.config.ts
      - ./src/**/*.ts
      - ./test/**/*.ts
      - ./e2e/**/*.ts
      - ./scripts/**/*.ts
    cmd: bunx biome check .

  format:
    sources: *typescript-sources
    cmd: bunx biome check --write .

  typecheck:
    desc: Type-check every TypeScript file (bun test does not type-check)
    cmd: bunx tsc --noEmit --project tsconfig.json

  verify:
    requires:
      vars:
      - summary
    cmds:
      - cmd: GITHUB_STEP_SUMMARY={{ .summary }} bunx playwright test
        ignore_error: true
      - cmd: |
          # The screenshots link only exists on a real Actions run (it holds run and artifact ids), so drop it
          # from a copy before diffing. The CI workflow checks separately that the artifact was uploaded.
          # Durations of tests that launch a browser vary with a cold runner, so compare them as a placeholder.
          link='<p><a href="[^"]*/actions/runs/[0-9]*/artifacts/[0-9]*">Screenshots</a></p>'
          duration='<td>[0-9][0-9]*\.[0-9]s</td>'
          expected=$(mktemp)
          actual=$(mktemp)
          sed -e "s|$duration|<td>DURATION</td>|g" e2e/snapshots/summary.md > "$expected"
          sed -e "s|$link||g" -e "s|$duration|<td>DURATION</td>|g" "{{ .summary }}" > "$actual"
          diff -u "$expected" "$actual"
          status=$?
          rm "$expected" "$actual"
          exit $status

  build:
    cmds:
      - bun build index.ts --outdir dist --target node --external '@actions/core' --external '@actions/artifact' --external '@playwright/test'
      - bunx tsc --project tsconfig.build.json

  playwright:diff:
    desc: Diff reporter-facing Playwright types between the installed and a target version (default latest)
    cmd: bun scripts/diffPlaywrightTypes.ts {{ .version | default "latest" }}

  test:all:
    cmds:
      - task: format
      - task: lint
      - task: typecheck
      - task: test
      - task: verify
        vars:
          summary: test-results/summary.md
      - task: build
