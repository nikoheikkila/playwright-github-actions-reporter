# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:

  install:
    sources:
      - package.json
    generates:
      - bun.lock
    cmd: bun install --frozen-lockfile

  test:
    env:
      AGENT: "1"
    cmd: bun test --parallel --coverage

  test:watch:
    interactive: true
    env:
      AGENT: "1"
    cmd: bun test --parallel --watch

  # No `sources` on lint or format: Task skipped them as "up to date", so a run looked green without linting anything.
  lint:
    cmd: bunx biome check .

  format:
    cmd: bunx biome check --write .

  typecheck:
    desc: Type-check every TypeScript file (bun test does not type-check)
    cmd: bunx tsc --noEmit --project tsconfig.json

  verify:
    requires:
      vars:
      - summary
    cmds:
      - cmd: GITHUB_STEP_SUMMARY={{ .summary }} bunx playwright test
        ignore_error: true
      - cmd: |
          # The screenshots and videos links only exist on a real Actions run (it holds run and artifact ids), so drop their lines
          # from a copy before diffing. The CI workflow checks separately that the artifact was uploaded.
          # Durations of tests that launch a browser vary with a cold runner, so compare them as a placeholder.
          link='<a href="[^"]*/actions/runs/[0-9]*/artifacts/[0-9]*">(Screenshots|Videos)</a>'
          duration='<td>[0-9][0-9]*\.[0-9]s</td>'
          expected=$(mktemp)
          actual=$(mktemp)
          sed -e "s|$duration|<td>DURATION</td>|g" e2e/snapshots/summary.md > "$expected"
          sed -E -e "\\~^$link$~d" -e "s|$duration|<td>DURATION</td>|g" "{{ .summary }}" > "$actual"
          diff -u "$expected" "$actual"
          status=$?
          rm "$expected" "$actual"
          exit $status

  build:
    cmds:
      - bun build index.ts --outdir dist --target node --external '@actions/core' --external '@actions/artifact' --external '@playwright/test'
      - bunx tsc --project tsconfig.build.json

  mutation:
    desc: Mutation-test every production file with Stryker (report in reports/mutation/)
    cmd: bunx stryker run

  mutation:incremental:
    desc: Mutation-test with Stryker, reusing results for unchanged code and tests
    cmd: bunx stryker run --incremental

  mutation:diff:
    desc: Mutation-test the production files changed since a base branch (default origin/HEAD)
    cmd: bun scripts/strykerDiff.ts {{ .base }}

  docs:check:
    desc: Fail when AGENTS.md or README.md names a file that does not exist
    cmd: bun scripts/checkDocs.ts

  playwright:diff:
    desc: Diff reporter-facing Playwright types between the installed and a target version (default latest)
    cmd: bun scripts/diffPlaywrightTypes.ts {{ .version | default "latest" }}

  check:
    desc: Read-only pipeline (lint, typecheck, docs, unit tests, e2e verify, build); the Stop hook runs this
    cmds:
      - task: lint
      - task: typecheck
      - task: docs:check
      - task: test
      - task: verify
        vars:
          summary: test-results/summary.md
      - task: build

  test:all:
    desc: Format, then run the read-only check pipeline
    cmds:
      - task: format
      - task: check
